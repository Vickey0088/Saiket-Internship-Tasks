<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card Task</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      width: 300px;
      overflow: hidden;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: auto;
    }

    .card-content {
      padding: 20px;
      text-align: center;
    }

    .product-name {
      font-size: 1.2rem;
      margin: 10px 0;
      font-weight: 600;
    }

    .price {
      color: #27ae60;
      font-size: 1.1rem;
      margin-bottom: 15px;
    }

    .btn {
      background-color: #3498db;
      color: #fff;
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #01080c;
      color: white;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="https://tse1.mm.bing.net/th?id=OIP.Y0zf7LrWrHrQEeVqxOZPnQHaEl&pid=Api&rs=1&c=1&qlt=95&w=176&h=108" alt="Product Image">
    <div class="card-content">
      <div class="product-name">Cool Sneakers</div>
      <div class="price">$59.99</div>
      <button class="btn">Add to Cart</button>
    </div>
  </div>

</body>
</html>
